/* ===== v84: multi-monitor. Any window can be popped out into its own browser window (window.open). The live DOM node is MOVED into the popup, so listeners, canvases and closures keep working in the same JS realm; the popup is just another place to render.
   What makes that transparent: (1) every window/document listener registered by the app is replicated onto the popups (hotkeys, drags, undo commits, context menus);
   (2) document.querySelector / querySelectorAll / getElementById also search the popups, so $() and $$() keep finding moved elements; (3) menus, panels and file pickers open in the window you last touched.
   Placement on another monitor uses the Window Management API (Chromium, asks permission once); elsewhere the popup opens normally and can be dragged to any screen. ===== */

   • Rhythm figure: one pitch (or, with Chorder ON, a chord per hit) on a rhythmic figure — Pulse, Offbeat, Gallop, Tresillo, Charleston, Syncopated, Dotted, Roll — repeated over Length
   • Scale run    : scale-locked melodic pattern from the clicked note (Tools → Scale; Major if Off): Up / Down / Up-down / Thirds / Alberti / Pendulum / Octaves
   • Riff (random): scale-locked random-walk melody with a chosen density, chord tones on the strong beats; every click rolls a new riff
   Rate = time unit (1/32 … 1/4), Length = span in steps, Gate = note length. Stamp notes share a key (sk): with a Stamp mode on, clicking a stamp note deletes the whole
   stamp, Alt+click deletes a single note. Shift+C cycles the mode. Settings are kept in localStorage together with the Chorder (km-chorder). ===== */
